[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "s7tools"
version = "0.1.0"
description = "Übungsprojekt für CI/CD: TPKT-Rahmen, S7-Adressen und ein kleiner TCP-Client"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: braucht einen (simulierten) SPS-Server"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
